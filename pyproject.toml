[project]
name = "production-automation"
version = "0.1.0"
description = "AI Production Automation System (spec v1.1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.12",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.40",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
  "boto3>=1.35",
  "joserfc>=1.0",
  "email-validator>=2.2",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "tzdata",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "anthropic>=1.8",
  "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "reportlab>=4.2"]

[tool.pytest.ini_options]
pythonpath = [".", "services/api", "services"]
testpaths = ["tests"]
markers = [
  "db: requires the local PostgreSQL from infra/local (skipped when unreachable)",
  "infra: requires Redis and object storage from infra/local (skipped when unreachable)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["services/api", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"services/api/app/seed/**" = ["S105", "S106"]
"services/api/migrations/**" = ["S608"]  # static DDL built from constants
